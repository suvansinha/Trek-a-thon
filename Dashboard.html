<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
  
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  height: 100vh;
}


.dashboard-container {
  display: flex;
  width: 100%;
}


.sidebar {
  width: 250px;
  background: linear-gradient(180deg, #FFC400, #FF9100, #DD2C00);
  color: #fff;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 24px;
}

.sidebar nav ul {
  list-style: none;
}

.sidebar nav ul li {
  margin: 15px 0;
}

.sidebar nav ul li a {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
  transition: color 0.3s;
  background-color: yellow;
  width: 200px;
  height: 30px;
  border-radius: 5px;
  display: flex;
  justify-content: center;
  padding-top: 6px;
  box-shadow: #555 5px 2px 5px ;
}

.sidebar nav ul li a:hover {
  color: #FFC400;
}



.main-content {
  flex-grow: 1;
  background: #f5f5f5;
  padding: 20px;
  overflow-y: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 28px;
}

.user-info {
  font-size: 16px;
  color: #555;
}


.cards {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.card {
  flex: 1;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  text-align: center;
}

.card h3 {
  font-size: 18px;
  margin-bottom: 10px;
  color: #DD2C00;
}

.card p {
  font-size: 24px;
  font-weight: bold;
}


.data-table {
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.data-table h2 {
  margin-bottom: 20px;
  font-size: 22px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

table thead {
  background: #DD2C00;
  color: #fff;
}

table thead th {
  padding: 10px;
  text-align: left;
}

table tbody tr {
  border-bottom: 1px solid #ddd;
}

table tbody td {
  padding: 10px;
}

table tbody tr:nth-child(even) {
  background: #f9f9f9;
}

</style>
<body>
  <div class="dashboard-container">
   
    <aside class="sidebar">
      <h2>Admin Panel</h2>
      <nav>
        <ul>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="users.html" class="nav-link">Users</a></li>
          <li><a href="analytics.html" class="nav-link">Analytics</a></li>
          <li><a href="settings.html" class="nav-link">Settings</a></li>
          <li><a href="logout.html" class="nav-link">Logout</a></li>
        </ul>
      </nav>
    </aside>

    
    <main class="main-content">
      <header class="header">
        <h1>Dashboard</h1>
        <div class="user-info">
          <span>Welcome, Admin</span>
        </div>
      </header>
      <section class="content">
        
        <div class="cards">
          <div class="card">
            <h3>Total Users</h3>
            <p>1,234</p>
          </div>
          <div class="card">
            <h3>New Signups</h3>
            <p>56</p>
          </div>
          <div class="card">
            <h3>Active Users</h3>
            <p>345</p>
          </div>
        </div>

        
        <div class="data-table">
          <h2>Recent Activities</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>User</th>
                <th>Activity</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>Login</td>
                <td>10:15 AM</td>
              </tr>
              <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>Signup</td>
                <td>10:30 AM</td>
              </tr>
              <tr>
                <td>3</td>
                <td>Michael Brown</td>
                <td>Logout</td>
                <td>10:45 AM</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
